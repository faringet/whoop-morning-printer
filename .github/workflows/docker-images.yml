name: Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  build-and-push-go-services:
    name: build-and-push-${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: migrator
            image_suffix: migrator
            service_cmd: ./cmd/migrator

          - service: morningbot
            image_suffix: morningbot
            service_cmd: ./services/morningbot/cmd/morningbot

          - service: whoopsync
            image_suffix: whoopsync
            service_cmd: ./services/whoopsync/cmd/whoopsync

          - service: coach
            image_suffix: coach
            service_cmd: ./services/coach/cmd/coach

          - service: receiptworker
            image_suffix: receiptworker
            service_cmd: ./services/receiptworker/cmd/receiptworker

          - service: printergateway
            image_suffix: printergateway
            service_cmd: ./services/printergateway/cmd/printergateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image_suffix }}
          tags: |
            type=sha,format=short
            type=raw,value=main,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ matrix.image_suffix }}
            org.opencontainers.image.description=whoop-morning-printer ${{ matrix.image_suffix }} service
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/go-service.Dockerfile
          push: true
          build-args: |
            SERVICE_CMD=${{ matrix.service_cmd }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-and-push-morningapp:
    name: build-and-push-morningapp
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/morningapp
          tags: |
            type=sha,format=short
            type=raw,value=main,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=morningapp
            org.opencontainers.image.description=whoop-morning-printer Morning App frontend
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/web-service.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}