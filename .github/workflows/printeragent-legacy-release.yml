name: Printeragent Legacy Release

on:
  push:
    tags:
      - "v*-legacy.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Legacy release version, for example v0.1.0-legacy.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: printeragent-legacy-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-printeragent-legacy:
    name: release-printeragent-legacy-darwin-amd64
    runs-on: ubuntu-latest

    env:
      TARGET_OS: darwin
      TARGET_ARCH: amd64
      GOAMD64: v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${VERSION}" =~ ^v[0-9]+(\.[0-9]+){1,2}-legacy\.[0-9]+$ ]]; then
            echo "Invalid version: ${VERSION}"
            echo "Expected something like v0.1.0-legacy.1"
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Setup Go 1.20
        uses: actions/setup-go@v5
        with:
          go-version: "1.20.14"
          cache: true
          cache-dependency-path: |
            legacy/printeragent/go.mod
            legacy/printeragent/go.sum

      - name: Download modules
        working-directory: legacy/printeragent
        run: go mod download all

      - name: Test legacy printeragent
        working-directory: legacy/printeragent
        run: go test ./...

      - name: Build legacy printeragent for Intel macOS
        working-directory: legacy/printeragent
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: amd64
          GOAMD64: v1
        run: mkdir -p ../../dist/printeragent-legacy-darwin-amd64 && go build -trimpath -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }} -X main.commit=${{ github.sha }} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o ../../dist/printeragent-legacy-darwin-amd64/printeragent ./cmd/printeragent

      - name: Add example config
        run: cp legacy/printeragent/config/exampleConfig.yaml dist/printeragent-legacy-darwin-amd64/config.example.yaml

      - name: Add README
        shell: bash
        run: |
          cat > dist/printeragent-legacy-darwin-amd64/README.txt <<'EOF'
          WHOOP Morning Printer - legacy printeragent

          Target:
            macOS Intel / darwin-amd64
            Built with Go 1.20 for old macOS compatibility.

          Role:
            printeragent-legacy is a native Mac mini edge agent.
            It reads ready print_jobs from PostgreSQL and prints them through macOS CUPS/lp
            to the physical Star SP712 printer.

          Recommended directory layout on Mac mini:

            /opt/whoop-morning-printer/
              bin/
                printeragent-legacy

              config/
                config.local.yaml

              logs/
                printeragent.log

              out/
                print-spool/
                receipts/

          Important:
            The release archive includes config.example.yaml only as a template.
            The real runtime config must be created on the Mac mini as:

              /opt/whoop-morning-printer/config/config.local.yaml

            Do not put real database passwords or secrets into GitHub releases.

          Install:

            sudo mkdir -p /opt/whoop-morning-printer/bin
            sudo mkdir -p /opt/whoop-morning-printer/config
            sudo mkdir -p /opt/whoop-morning-printer/logs
            sudo mkdir -p /opt/whoop-morning-printer/out/print-spool
            sudo mkdir -p /opt/whoop-morning-printer/out/receipts

            sudo cp printeragent /opt/whoop-morning-printer/bin/printeragent-legacy
            sudo chmod +x /opt/whoop-morning-printer/bin/printeragent-legacy

            sudo cp config.example.yaml /opt/whoop-morning-printer/config/config.local.yaml

          Configure:

            Edit the runtime config:

              sudo nano /opt/whoop-morning-printer/config/config.local.yaml

            Minimum things to check:
              - storage.postgres.dsn points to the VPS PostgreSQL through SSH tunnel / VPN
              - output.mode is printer
              - output.printer_name matches the macOS printer queue name from: lpstat -p -d
              - output.cpi and output.lpi match the tested Star SP712 settings
              - logger.file_enabled is true
              - logger.file_path is ./logs/printeragent.log

          SSH tunnel example:

            ssh -N -L 15434:127.0.0.1:15434 root@78.17.3.219

          Run manually:

            cd /opt/whoop-morning-printer
            ./bin/printeragent-legacy

          Logs:

            tail -f /opt/whoop-morning-printer/logs/printeragent.log

          Notes:
            Run printeragent-legacy from /opt/whoop-morning-printer.
            The relative paths in config.local.yaml are resolved from the current working directory.
            For example:
              ./logs/printeragent.log
              ./out/print-spool
              ./out/receipts
          EOF

      - name: Package release archive
        shell: bash
        run: cd dist && tar -czf printeragent-legacy-darwin-amd64.tar.gz printeragent-legacy-darwin-amd64

      - name: Calculate checksum
        shell: bash
        run: cd dist && shasum -a 256 printeragent-legacy-darwin-amd64.tar.gz > printeragent-legacy-darwin-amd64.sha256

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "${VERSION}" dist/printeragent-legacy-darwin-amd64.tar.gz dist/printeragent-legacy-darwin-amd64.sha256 --title "${VERSION}" --notes "Legacy printeragent release for old Intel macOS / darwin-amd64"