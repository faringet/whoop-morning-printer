# legacy printeragent
#
# Локальный агент печати для WHOOP Morning Printer.
#
# Разница с актуалом в том что предназначен для старого Mac mini на macOS 10.13.6.
# И, соотвественно пришлой переехать на go 1.20 и выкинуть часть свистоперделок чтобы все завелось.
#
# У меня он живёт на Mac mini рядом с физическим принтером.
# Остальные сервисы будут жить на VPS.
#
# Flow:
#   1. printeragent смотрит таблицу print_jobs.
#   2. Забирает jobs со status=ready, not_before<=now и непустым payload_text.
#   3. Печатает чек выбранным способом.
#   4. Помечает job как printed или failed.
#
# Основные режимы:
#
# printeragent.mode:
#   once
#     Один раз забрать доступные ready jobs, напечатать их и завершиться.
#     Для отладки  - самое оно.
#
#   interval
#     Работать постоянно и проверять очередь каждые printeragent.interval.
#     Это основной режим прода.
#
# output.mode:
#   file
#     Сохранить чек в .txt файл.
#     Режим для локальной отладки без принтера.
#
#   stdout
#     Вывести чек в консоль.
#     Удобно быстро посмотреть payload, база так сказать.
#
#   printer
#     Физически напечатать чек через локальный принтер.
#     На macOS использую CUPS/lp:
#       lp -d <printer_name> -o cpi=<cpi> -o lpi=<lpi> <file>
#
# Для Star SP712 методом проб и ошибок подобрал:
#   receipt.width: 36 в receiptworker
#   output.cpi: 16
#   output.lpi: 8
#   raw-режим не используем - херня получается

app_name: printeragent-legacy
env: prod

logger:
  level: info
  file_enabled: true
  file_path: "./logs/printeragent.log"

runtime:
  shutdown_timeout: 15s

storage:
  postgres:
    dsn: "postgres://whoop:whoop@localhost:5432/whoop_morning_printer?sslmode=disable"
    max_open_conns: 5
    max_idle_conns: 2
    conn_max_lifetime: 30m
    conn_max_idle_time: 5m

printeragent:
  mode: interval

  user_id: 1

  interval: 5s
  poll_limit: 5
  worker_id: ""

  claim_ttl: 2m

  # Для физического принтера лучше оставить небольшую задержку.
  print_delay: 1s

output:
  mode: printer

  # Используется только для mode=file.
  dir: "./out/receipts"

  # Используется только для mode=printer.
  printer_name: "Star_SP712_STR_001"
  cpi: 16
  lpi: 8

  # куда скалыдываем чеки перед тем как их отправить на печать
  spool_dir: "./out/print-spool"

  # оставляем или нет .txt чеки после того как напечатали.
  keep_spool_files: true

  # Создавать output.dir / output.spool_dir, если папок нет.
  create_dirs: true

  # Дополнительные пустые строки в конце чека.
  trailing_blank_lines: 6