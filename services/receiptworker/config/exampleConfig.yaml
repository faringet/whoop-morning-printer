app_name: receiptworker
env: dev

logger:
  level: info
  json: true

runtime:
  # Сколько времени даём сервису на graceful shutdown.
  shutdown_timeout: 15s

storage:
  postgres:
    dsn: ""
    max_open_conns: 10
    max_idle_conns: 5
    conn_max_lifetime: 30m
    conn_max_idle_time: 5m

receiptworker:
  # Режим работы.
  #
  # once:
  #   Один раз проверить подходящие print_jobs,
  #   подготовить чеки и выйти.
  #
  # interval:
  #   Постоянно работать воркером:
  #   раз в interval проверять новые pending jobs.
  mode: once

  user_id: 1
  timezone: "Europe/Moscow"

  # Интервал между проверками в режиме interval.
  interval: 15s

  # Сколько задач максимум брать за один тик.
  poll_limit: 20

  # Готовить первый wake receipt.
  #
  # Этот чек не зависит от WHOOP и morning_advice.
  process_wake_receipt: true

  # Готовить второй финальный чек.
  #
  # Этот чек зависит от WHOOP snapshot и morning_advice.
  process_final_report: true

  # Если true, receiptworker может сам создать недостающий
  # final_report print_job для wake_plan.
  ensure_final_report_jobs: true

  # Если true, финальный чек требует готовый morning_advice.
  #
  # whoopsync     -> daily_health_snapshots
  # coach         -> morning_advice
  # receiptworker -> final_report
  final_report_require_advice: true

  # Если true, после final_deadline_at можно подготовить
  # fallback-чек, даже если WHOOP/advice так и не готовы.
  fallback_after_deadline: true

field_note:
  # Добавлять FIELD NOTE в первый wake receipt.
  #
  # FIELD NOTE не является критической частью печати:
  #
  # Ollama
  #   -> local grammar
  #   -> emergency fallback
  #
  # Ошибка генерации через Ollama не должна ломать wake receipt.
  enabled: true

  ollama:
    # Использовать Ollama как основной источник FIELD NOTE.
    #
    # Если false, receiptworker сразу перейдёт
    # к локальному grammar generator.
    enabled: false

    # Например:
    # http://127.0.0.1:11434
    # http://ollama:11434
    base_url: ""

    # Модель для генерации FIELD NOTE.
    model: "qwen3.5:9b"

    # Максимальное время ожидания Ollama.
    # После timeout должен использоваться локальный fallback.
    timeout: 10m

    # Сколько Ollama держит модель загруженной после запроса.
    keep_alive: 2h

receipt:
  # Ширина чека в символах.
  #
  # Частые варианты: 32 / 36 / 40 / 42 / 48.
  width: 42

  # Символ-разделитель секций.
  line_separator: "-"

  # Включить ASCII-арт в первом чеке.
  art_enabled: true

  # Режим выбора ASCII-арта:
  #
  # deterministic
  # random
  art_mode: deterministic

  # Максимум строк ASCII-арта.
  max_art_lines: 8