app_name: receiptworker

env: dev

logger:
  level: info
  json: true

runtime:
  # Сколько времени даём сервису на graceful shutdown.
  shutdown_timeout: 15s

storage:
  postgres:
    dsn: ""
    max_open_conns: 10
    max_idle_conns: 5
    conn_max_lifetime: 30m
    conn_max_idle_time: 5m

receiptworker:
  # Режим работы.
  #
  # once:
  #   Один раз проверить подходящие print_jobs,
  #   подготовить чеки и выйти.
  #   Для отладки.
  #
  # interval:
  #   Постоянно работать воркером:
  #   раз в interval проверять новые pending jobs.
  mode: once

  user_id: 1

  timezone: "Europe/Moscow"

  # Интервал между проверками в режиме interval.
  interval: 15s

  # Сколько задач максимум брать за один тик.
  poll_limit: 20

  # Готовить первый чек-будильник.
  #
  # Этот чек не зависит от WHOOP и coach.
  # Его задача — напечататься строго по wake_at и разбудить.
  process_wake_receipt: true

  # Готовить второй финальный чек.
  #
  # Этот чек зависит от WHOOP snapshot и morning_advice.
  process_final_report: true

  # Если true, receiptworker может сам создать недостающий final_report print_job
  # для wake_plan, если morningbot его ещё не создал.
  #
  # Это удобно для обратной совместимости:
  # старые wake_plans уже существуют, а final_report_job_id может быть NULL.
  ensure_final_report_jobs: true

  # Если true, финальный чек требует готовый morning_advice.
  #
  # В нормальном flow:
  # whoopsync → daily_health_snapshots
  # coach     → morning_advice
  # receiptworker → final_report
  final_report_require_advice: true

  # Если true, после final_deadline_at можно подготовить fallback-чек,
  # даже если WHOOP/advice так и не готовы.
  #
  # Например:
  fallback_after_deadline: true

receipt:
  # Ширина чека в символах.
  #
  # Частые варианты: 32 / 40 / 42 / 48.
  width: 42

  # Символ-разделитель секций.
  # Renderer будет повторять его на всю ширину receipt.width.
  line_separator: "-"

  # Включить ASCII-арт в первом чеке.
  art_enabled: true

  # Режим выбора ASCII-арта.
  #
  # deterministic
  #
  # random
  art_mode: deterministic

  # Максимум строк ASCII-арта, которые можно вставить в чек.
  max_art_lines: 8